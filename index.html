<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系动画 - Solar System Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .solar-system {
            position: relative;
            width: 800px;
            height: 800px;
            margin: 0 auto;
        }

        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ffd700 0%, #ff8c00 70%, #ff4500 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px #ffd700, 0 0 60px #ff8c00;
            animation: sunPulse 3s ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes sunPulse {
            from {
                box-shadow: 0 0 30px #ffd700, 0 0 60px #ff8c00;
            }
            to {
                box-shadow: 0 0 40px #ffd700, 0 0 80px #ff8c00, 0 0 100px #ff4500;
            }
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            transform-origin: 50% 50%;
        }

        /* 水星轨道 Mercury */
        .mercury-orbit {
            width: 120px;
            height: 120px;
            animation: orbit 8s linear infinite;
        }

        .mercury {
            width: 6px;
            height: 6px;
            background: #8c7853;
            top: -3px;
            left: 57px;
        }

        /* 金星轨道 Venus */
        .venus-orbit {
            width: 160px;
            height: 160px;
            animation: orbit 12s linear infinite;
        }

        .venus {
            width: 10px;
            height: 10px;
            background: #ffc649;
            top: -5px;
            left: 75px;
        }

        /* 地球轨道 Earth */
        .earth-orbit {
            width: 200px;
            height: 200px;
            animation: orbit 16s linear infinite;
        }

        .earth {
            width: 12px;
            height: 12px;
            background: linear-gradient(45deg, #6b93d6 0%, #4d84c4 50%, #87ceeb 100%);
            top: -6px;
            left: 94px;
            position: relative;
        }

        .earth::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 3px;
            background: #c0c0c0;
            border-radius: 50%;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            animation: moonOrbit 2s linear infinite;
        }

        @keyframes moonOrbit {
            from { transform: translateX(-50%) rotate(0deg) translateX(10px) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg) translateX(10px) rotate(-360deg); }
        }

        /* 火星轨道 Mars */
        .mars-orbit {
            width: 260px;
            height: 260px;
            animation: orbit 24s linear infinite;
        }

        .mars {
            width: 8px;
            height: 8px;
            background: #cd5c5c;
            top: -4px;
            left: 126px;
        }

        /* 木星轨道 Jupiter */
        .jupiter-orbit {
            width: 360px;
            height: 360px;
            animation: orbit 40s linear infinite;
        }

        .jupiter {
            width: 24px;
            height: 24px;
            background: linear-gradient(45deg, #d8ca9d 0%, #fab92e 50%, #f4a460 100%);
            top: -12px;
            left: 168px;
        }

        /* 土星轨道 Saturn */
        .saturn-orbit {
            width: 440px;
            height: 440px;
            animation: orbit 60s linear infinite;
        }

        .saturn {
            width: 20px;
            height: 20px;
            background: #fad5a5;
            top: -10px;
            left: 210px;
            position: relative;
        }

        .saturn::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 215, 165, 0.6);
            border-radius: 50%;
            top: -5px;
            left: -5px;
            transform: perspective(30px) rotateX(80deg);
        }

        /* 天王星轨道 Uranus */
        .uranus-orbit {
            width: 520px;
            height: 520px;
            animation: orbit 84s linear infinite;
        }

        .uranus {
            width: 16px;
            height: 16px;
            background: #4fd0e4;
            top: -8px;
            left: 252px;
        }

        /* 海王星轨道 Neptune */
        .neptune-orbit {
            width: 600px;
            height: 600px;
            animation: orbit 120s linear infinite;
        }

        .neptune {
            width: 14px;
            height: 14px;
            background: #4b70dd;
            top: -7px;
            left: 293px;
        }

        @keyframes orbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 控制面板 */
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            z-index: 100;
        }

        .controls h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
        }

        .control-group input {
            width: 100%;
            padding: 5px;
            border: none;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .control-group button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 5px;
        }

        .control-group button:hover {
            background: #45a049;
        }

        .control-group button.pause {
            background: #ff9800;
        }

        .control-group button.pause:hover {
            background: #e68900;
        }

        /* 行星信息 */
        .planet-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 12px;
            z-index: 100;
            max-width: 200px;
        }

        .planet-info h4 {
            color: #ffd700;
            margin-bottom: 5px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .solar-system {
                width: 90vw;
                height: 90vw;
                max-width: 600px;
                max-height: 600px;
            }

            .controls {
                font-size: 12px;
                padding: 15px;
            }

            .planet-info {
                font-size: 10px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="controls">
        <h3>太阳系控制面板</h3>
        <div class="control-group">
            <label>动画速度:</label>
            <input type="range" id="speedControl" min="0.1" max="5" step="0.1" value="1">
            <span id="speedValue">1x</span>
        </div>
        <div class="control-group">
            <button id="playPause">暂停动画</button>
            <button id="reset">重置位置</button>
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="showOrbits" checked> 显示轨道
            </label>
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="showLabels"> 显示行星名称
            </label>
        </div>
    </div>

    <div class="planet-info">
        <h4>太阳系</h4>
        <p>包含太阳和8大行星的动态模拟</p>
        <br>
        <p><strong>行星列表：</strong></p>
        <p>• 水星 (Mercury)</p>
        <p>• 金星 (Venus)</p>
        <p>• 地球 (Earth) + 月球</p>
        <p>• 火星 (Mars)</p>
        <p>• 木星 (Jupiter)</p>
        <p>• 土星 (Saturn) + 光环</p>
        <p>• 天王星 (Uranus)</p>
        <p>• 海王星 (Neptune)</p>
    </div>

    <div class="solar-system">
        <div class="sun"></div>
        
        <!-- 水星 Mercury -->
        <div class="orbit mercury-orbit">
            <div class="planet mercury" data-planet="水星"></div>
        </div>
        
        <!-- 金星 Venus -->
        <div class="orbit venus-orbit">
            <div class="planet venus" data-planet="金星"></div>
        </div>
        
        <!-- 地球 Earth -->
        <div class="orbit earth-orbit">
            <div class="planet earth" data-planet="地球"></div>
        </div>
        
        <!-- 火星 Mars -->
        <div class="orbit mars-orbit">
            <div class="planet mars" data-planet="火星"></div>
        </div>
        
        <!-- 木星 Jupiter -->
        <div class="orbit jupiter-orbit">
            <div class="planet jupiter" data-planet="木星"></div>
        </div>
        
        <!-- 土星 Saturn -->
        <div class="orbit saturn-orbit">
            <div class="planet saturn" data-planet="土星"></div>
        </div>
        
        <!-- 天王星 Uranus -->
        <div class="orbit uranus-orbit">
            <div class="planet uranus" data-planet="天王星"></div>
        </div>
        
        <!-- 海王星 Neptune -->
        <div class="orbit neptune-orbit">
            <div class="planet neptune" data-planet="海王星"></div>
        </div>
    </div>

    <script>
        // 太阳系动画控制系统
        class SolarSystemController {
            constructor() {
                this.isPlaying = true;
                this.currentSpeed = 1;
                this.orbits = document.querySelectorAll('.orbit');
                this.planets = document.querySelectorAll('.planet');
                this.sun = document.querySelector('.sun');
                
                this.initializeControls();
                this.createStars();
                this.addPlanetHoverEffects();
            }

            // 初始化控制面板
            initializeControls() {
                const speedControl = document.getElementById('speedControl');
                const speedValue = document.getElementById('speedValue');
                const playPause = document.getElementById('playPause');
                const reset = document.getElementById('reset');
                const showOrbits = document.getElementById('showOrbits');
                const showLabels = document.getElementById('showLabels');

                // 速度控制
                speedControl.addEventListener('input', (e) => {
                    this.currentSpeed = parseFloat(e.target.value);
                    speedValue.textContent = `${this.currentSpeed}x`;
                    this.updateAnimationSpeed();
                });

                // 播放/暂停控制
                playPause.addEventListener('click', () => {
                    this.toggleAnimation();
                    playPause.textContent = this.isPlaying ? '暂停动画' : '播放动画';
                    playPause.className = this.isPlaying ? '' : 'pause';
                });

                // 重置按钮
                reset.addEventListener('click', () => {
                    this.resetPlanets();
                });

                // 显示轨道控制
                showOrbits.addEventListener('change', (e) => {
                    this.toggleOrbits(e.target.checked);
                });

                // 显示标签控制
                showLabels.addEventListener('change', (e) => {
                    this.toggleLabels(e.target.checked);
                });
            }

            // 更新动画速度
            updateAnimationSpeed() {
                const root = document.documentElement;
                root.style.setProperty('--animation-speed', this.currentSpeed);
                
                this.orbits.forEach((orbit, index) => {
                    const baseDuration = [8, 12, 16, 24, 40, 60, 84, 120][index];
                    const newDuration = baseDuration / this.currentSpeed;
                    orbit.style.animationDuration = `${newDuration}s`;
                });

                // 更新太阳脉冲和月球轨道
                this.sun.style.animationDuration = `${3 / this.currentSpeed}s`;
                const earth = document.querySelector('.earth');
                if (earth) {
                    earth.style.setProperty('--moon-duration', `${2 / this.currentSpeed}s`);
                }
            }

            // 切换动画播放状态
            toggleAnimation() {
                this.isPlaying = !this.isPlaying;
                const animationState = this.isPlaying ? 'running' : 'paused';
                
                this.orbits.forEach(orbit => {
                    orbit.style.animationPlayState = animationState;
                });
                this.sun.style.animationPlayState = animationState;
            }

            // 重置行星位置
            resetPlanets() {
                this.orbits.forEach(orbit => {
                    orbit.style.animation = 'none';
                    orbit.offsetHeight; // 触发重排
                    orbit.style.animation = null;
                });
                this.updateAnimationSpeed();
            }

            // 切换轨道显示
            toggleOrbits(show) {
                this.orbits.forEach(orbit => {
                    orbit.style.borderColor = show ? 'rgba(255, 255, 255, 0.1)' : 'transparent';
                });
            }

            // 切换标签显示
            toggleLabels(show) {
                this.planets.forEach(planet => {
                    if (show && !planet.querySelector('.planet-label')) {
                        const label = document.createElement('div');
                        label.className = 'planet-label';
                        label.textContent = planet.dataset.planet;
                        label.style.cssText = `
                            position: absolute;
                            top: -25px;
                            left: 50%;
                            transform: translateX(-50%);
                            color: white;
                            font-size: 10px;
                            background: rgba(0, 0, 0, 0.7);
                            padding: 2px 6px;
                            border-radius: 3px;
                            white-space: nowrap;
                            pointer-events: none;
                        `;
                        planet.appendChild(label);
                    } else if (!show) {
                        const label = planet.querySelector('.planet-label');
                        if (label) label.remove();
                    }
                });
            }

            // 创建星空背景
            createStars() {
                const starsContainer = document.getElementById('stars');
                const starCount = 200;

                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 3 + 's';
                    star.style.opacity = Math.random() * 0.8 + 0.2;
                    starsContainer.appendChild(star);
                }
            }

            // 添加行星悬停效果
            addPlanetHoverEffects() {
                this.planets.forEach(planet => {
                    planet.addEventListener('mouseenter', () => {
                        planet.style.transform = 'scale(1.5)';
                        planet.style.transition = 'transform 0.3s ease';
                        planet.style.zIndex = '50';
                        
                        // 显示行星信息
                        this.showPlanetInfo(planet.dataset.planet);
                    });

                    planet.addEventListener('mouseleave', () => {
                        planet.style.transform = 'scale(1)';
                        planet.style.zIndex = '1';
                    });
                });
            }

            // 显示行星详细信息
            showPlanetInfo(planetName) {
                const planetData = {
                    '水星': { distance: '0.39 AU', period: '88天', temp: '167°C' },
                    '金星': { distance: '0.72 AU', period: '225天', temp: '464°C' },
                    '地球': { distance: '1.00 AU', period: '365天', temp: '15°C' },
                    '火星': { distance: '1.52 AU', period: '687天', temp: '-65°C' },
                    '木星': { distance: '5.20 AU', period: '12年', temp: '-110°C' },
                    '土星': { distance: '9.58 AU', period: '29年', temp: '-140°C' },
                    '天王星': { distance: '19.2 AU', period: '84年', temp: '-195°C' },
                    '海王星': { distance: '30.1 AU', period: '165年', temp: '-200°C' }
                };

                const info = planetData[planetName];
                const infoPanel = document.querySelector('.planet-info');
                
                if (info) {
                    infoPanel.innerHTML = `
                        <h4>${planetName}</h4>
                        <p><strong>距离太阳:</strong> ${info.distance}</p>
                        <p><strong>公转周期:</strong> ${info.period}</p>
                        <p><strong>平均温度:</strong> ${info.temp}</p>
                    `;
                }
            }
        }

        // 初始化太阳系动画
        document.addEventListener('DOMContentLoaded', () => {
            new SolarSystemController();
        });

        // 添加月球轨道动画的CSS变量支持
        document.documentElement.style.setProperty('--moon-duration', '2s');
    </script>
</body>
</html>
